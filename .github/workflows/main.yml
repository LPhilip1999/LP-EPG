name: Automatic MetaX EPG Update

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests  # This ensures the library is always there

      - name: Run EPG Script
        run: python fetch_epg.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add epg.xml epg.xml.gz tvg-ids.txt
          git commit -m "Daily EPG Auto-Update" || exit 0
          git push
