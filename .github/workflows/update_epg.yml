name: Update EPG Files

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Reconstruct Private Files
        run: |
          echo "${{ secrets.CHANNELS_DATA }}" > channels.txt
          echo "${{ secrets.PYTHON_SCRIPT }}" > merge_epg.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run EPG Merge Script
        run: python merge_epg.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epg.xml epg.xml.gz
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update EPG: $(date +'%Y-%m-%d %H:%M') PHT"
            git push
          fi
